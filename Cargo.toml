[package]
name = "tetris"
version = "0.5.0"
edition = "2024"

[features]
default = ["fps_limiter"]
fps_limiter = ["bevy_framepace"]

[dependencies]
bevy = { version = "0.19.1", features = ["vorbis"] }
bevy_dev_tools = "0.19.1"
bevy_framepace = { version = "0.22.0", optional = true }
strum = "0.28"
strum_macros = "0.28"
rand = { version = "0.10", features = ["chacha"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
image = "0.25"
rust-i18n = "4.2.2"
sys-locale = { version = "0.3.2", features = ["js"] }
winit = "0.30.13"
tetris_macros = { path = "tetris_macros" }

[build-dependencies]
winresource = "0.1.31"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
